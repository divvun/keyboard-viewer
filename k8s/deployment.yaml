apiVersion: apps/v1
kind: Deployment
metadata:
  name: keyboard-viewer
  labels:
    app: keyboard-viewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keyboard-viewer
  template:
    metadata:
      labels:
        app: keyboard-viewer
    spec:
      containers:
        - name: keyboard-viewer
          image: ghcr.io/divvun/keyboard-viewer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: token
                  optional: true
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      imagePullSecrets:
        - name: ghcr-secret
